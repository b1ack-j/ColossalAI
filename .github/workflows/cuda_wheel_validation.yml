name: Validate CUDA wheel without a GPU

on:
  pull_request:
    paths:
      - '.github/workflows/cuda_wheel_validation.yml'
      - 'extensions/**'
      - 'colossalai/kernel/**'
      - 'requirements/**'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'scripts/**'
      - 'tests/test_extensions/**'
  workflow_dispatch:
    inputs:
      arch_mode:
        description: Default exercises B1; explicit uses the list below
        type: choice
        options: [default, explicit]
        default: default
      arch_list:
        description: Explicit targets; must include 8.0 and 9.0 for this acceptance check
        type: string
        default: '8.0;9.0'

permissions:
  contents: read

jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test extension configuration, loading and inspection without Torch or CUDA
        run: python -m unittest discover -s tests/test_extensions -v
      - name: Check script syntax
        run: python -m py_compile scripts/*.py

  cuda-build:
    # Compilation is expensive; run explicitly while the baseline is being restored.
    if: github.event_name == 'workflow_dispatch'
    needs: inspector-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
      # Deliberately no --gpus option.
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      MAX_JOBS: '2'
    steps:
      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 python3-dev python3-venv git
      - uses: actions/checkout@v4
      - name: Install the fixed build environment
        run: |
          python3 -m venv /opt/wheel-venv
          /opt/wheel-venv/bin/python -m pip install pip==25.0.1 setuptools==75.8.0 wheel==0.45.1 build==1.2.2.post1 packaging==24.2 ninja==1.11.1.3
          /opt/wheel-venv/bin/python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cu124
      - name: Build and inspect the wheel
        shell: bash
        env:
          ARCH_MODE: ${{ inputs.arch_mode }}
          ARCH_LIST: ${{ inputs.arch_list }}
        run: |
          args=()
          if [[ "$ARCH_MODE" == explicit ]]; then
            args+=(--arch-list "$ARCH_LIST")
          fi
          /opt/wheel-venv/bin/python scripts/build_cuda_wheel.py --output /tmp/cuda-wheel-artifacts "${args[@]}"
      - name: Preserve wheel and evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-wheel-torch251-cu124-${{ inputs.arch_mode }}
          path: /tmp/cuda-wheel-artifacts/
          if-no-files-found: warn
          retention-days: 14
